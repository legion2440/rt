name: Verify RT bonuses

on:
  push:
    paths:
      - .github/workflows/verify-bonuses.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format, test and build
        run: |
          cargo fmt
          cargo test
          cargo build --release

      - name: Render required scenes
        run: |
          ./target/release/rt --scene 1 --width 800 --height 600 --reflect --refract --texture --out renders/scene1_sphere.ppm
          ./target/release/rt --scene 2 --width 800 --height 600 --reflect --refract --texture --out renders/scene2_plane_and_cube_lower_brightness.ppm
          ./target/release/rt --scene 3 --width 800 --height 600 --reflect --refract --texture --out renders/scene3_all_objects.ppm
          ./target/release/rt --scene 4 --width 800 --height 600 --reflect --refract --texture --out renders/scene4_all_objects_alt_camera.ppm

      - name: Render bonus scene
        run: |
          ./target/release/rt --scene 5 --width 400 --height 300 --reflect --refract --texture --out /tmp/bonus.ppm

      - name: Validate PPM output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = [
              Path('renders/scene1_sphere.ppm'),
              Path('renders/scene2_plane_and_cube_lower_brightness.ppm'),
              Path('renders/scene3_all_objects.ppm'),
              Path('renders/scene4_all_objects_alt_camera.ppm'),
          ]
          for path in required:
              tokens = path.read_text().split()
              assert tokens[0] == 'P3'
              assert tuple(map(int, tokens[1:3])) == (800, 600)
              assert tokens[3] == '255'
              assert len(tokens[4:]) == 800 * 600 * 3
              print(path, 'ok')

          bonus = Path('/tmp/bonus.ppm')
          tokens = bonus.read_text().split()
          assert tokens[0] == 'P3'
          assert tuple(map(int, tokens[1:3])) == (400, 300)
          assert len(tokens[4:]) == 400 * 300 * 3
          values = list(map(int, tokens[4:]))
          assert max(values) > min(values)
          print('bonus scene ok:', min(values), max(values))
          PY

      - name: Commit formatted sources and required renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src renders Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'format bonus shapes and refresh renders [skip ci]'
            git push
          fi
